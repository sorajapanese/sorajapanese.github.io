<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B2C20">
  <title>SORA Japanese Dining</title>
  <link rel="stylesheet" href="style.css">
<style>.page:not(.page7-approved-page){display:none!important}.book{display:block!important}.page7-approved-page{margin:0!important}</style></head>
<body>
  <main class="menu-stack">
    <section class="page image-page">
      <img class="page-art" src="assets/page1-frame-renewed.png" alt="SORA Japanese Dining kapak">
    </section>

    <section class="page image-page">
      <img class="page-art" src="assets/page2-frame-renewed.png" alt="SORA'nın Hikâyesi">
    </section>

    <section class="page menu-page" aria-label="Başlangıçlar, Salatalar ve Çorbalar">
      <img class="menu-background" src="assets/page3-frame-renewed.png" alt="" aria-hidden="true">
      <div class="page3-heading-cover" aria-hidden="true"></div>
      <div id="page3-menu" class="menu-items"></div>
    </section>

    <section class="page image-page page4-nutrition-page" aria-label="Nigiri ve Sashimi">
      <img class="page-art" src="assets/page4-approved-final.png" alt="SORA Nigiri ve Sashimi menüsü">
      <div id="page4-nutrition-hotspots" class="page4-nutrition-hotspots" aria-label="Nigiri ve Sashimi besin bilgileri"></div>
    </section>

    <section class="page image-page page5-approved-page" aria-label="Maki Rolls ve Vejetaryen Rolls">
      <img class="page-art" src="assets/page5-approved-final.png" alt="SORA Maki Rolls ve Vejetaryen Rolls menüsü">
      <div id="page5-nutrition-hotspots" class="page5-nutrition-hotspots" aria-label="Maki Rolls ve Vejetaryen Rolls besin bilgileri"></div>
    </section>

    <section class="page image-page page6-approved-page" aria-label="Special Rolls Pişmiş Roller">
      <img class="page-art" src="assets/page6-special-rolls-approved.png" alt="SORA Special Rolls Pişmiş Roller menüsü">
      <div id="page6-nutrition-hotspots" class="page6-nutrition-hotspots" aria-label="Special Rolls besin ve alerjen bilgileri"></div>
    </section>

    <section class="page image-page page7-approved-page" aria-label="Special Rolls Çiğ Roller">
      <img class="page-art" src="assets/page7-special-rolls-raw-approved.png" alt="SORA Special Rolls Çiğ Roller menüsü">
      <div class="page7-products-cover" aria-hidden="true"></div>
      <div id="page7-menu" class="page7-menu-items" aria-label="Special Rolls Çiğ Roller ürünleri"></div>
      <div id="page7-nutrition-hotspots" class="page7-nutrition-hotspots" aria-label="Special Rolls Çiğ Roller besin ve alerjen bilgileri"></div>
    </section>

    <section class="page image-page page8-approved-page" aria-label="Ana Yemekler ve Izgaralar">
      <img class="page-art" src="assets/page8-main-grill-approved.png" alt="SORA Ana Yemekler ve Izgaralar menüsü">
      <div id="page8-nutrition-hotspots" class="page8-nutrition-hotspots" aria-label="Ana Yemekler ve Izgaralar besin ve alerjen bilgileri"></div>
    </section>
  </main>

  <script src="menu-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
